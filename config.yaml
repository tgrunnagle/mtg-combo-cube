# Cube configuration: the blocklist, the blocklist queries, the outcome category table, the
# payoff table and the enabler table.
# Read from the working directory by default; pass another file with --config.

# Cards to always exclude from the cube
blocklist:
  - Command Tower
  - Arcane Signet
  - Path of Ancestry
  - Commander's Sphere
  - War Room
  - Command Beacon
  - Jeweled Lotus

# Scryfall queries whose matching cards are blocked too (paper cards, the first result page
# of 175 cards of each), resolved through the cache like the payoff queries
blocklist_queries:
  # The Un-set card types: Unfinity's sticker sheets and attractions, Unstable's contraptions
  # and hosts, and the augment cards that only combine with a host
  - t:stickers
  - t:attraction
  - t:contraption
  - t:host
  - keyword:augment

# What a combo does, from the features it produces on Commander Spellbook. A category lists
# case-insensitive substrings of feature names, or regular expressions prefixed with "re:".
# The long form {patterns: [...], min_combos: N} gives a category its own minimum for the
# Phase 2 outcome rule. A category without patterns is the catch-all (at most one).
outcome_categories:
  mana:
    - infinite colored mana
    - infinite colorless mana
    - infinite mana
    - infinite white mana
    - infinite blue mana
    - infinite black mana
    - infinite red mana
    - infinite green mana
  damage:
    - 're:infinite damage(?! to (all |most |some )?creatures)'
    - infinite combat damage
    - infinite lifeloss
  tokens:
    - infinite creature tokens
    - infinite tapped creature tokens
  triggers:
    - infinite creature etb
    - infinite creature ltb
    - infinite death triggers
    - infinite creature sacrifice triggers
  draw:
    - infinite card draw
  mill:
    - infinite mill
    - infinite self-mill
  lifegain:
    - 're:infinite lifegain(?! triggers)'
  counters:
    - +1/+1 counters
  turns:
    - infinite turns
  lock:
    - 're:^lock'
  storm:
    - infinite storm count
  win:
    - win the game
    - loses the game
  other: []

# The outlets that turn an engine into a win, per outcome category (each must be a category
# above): Scryfall `queries` (EDHREC order over paper cards without the Un-set ones, the
# first 25 unblocked cards of each), explicit
# `cards`, and `exclude`, names dropped whatever their source. A category may bound its own
# payoff floor with `min_payoffs` and `max_payoffs`.
payoffs:
  mana:
    queries:
      # X spells (X in the mana cost) and X activations
      - '(m:{X} or o:"{X}") o:"X damage" -t:land'
      - '(m:{X} or o:"{X}") (o:"draw X cards" or o:"draws X cards")'
      - '(m:{X} or o:"{X}") o:"loses X life"'
      - 'o:"{X}" o:"X +1/+1 counters"'
      # Repeatable activations whose whole cost is mana (no tap)
      - 'o:/^(\{[0-9WUBRGC]\})+: [^\n]*(deals \d+ damage|loses \d+ life)/ -t:land'
      - 'o:/^(\{[0-9WUBRGC]\})+: [^\n]*draws? (a|\d+) cards?/ -t:land'
    cards:
      - Torment of Hailfire  # "repeat the following process X times"
    exclude:
      - Chromatic Orrery
  storm:
    queries:
      - 'keyword:storm (o:damage or o:"create" or o:mills or o:"loses" or o:"draw" or o:"copy target")'
      - 'o:/whenever you cast (an|a) (instant|sorcery|noncreature|instant or sorcery|spell)/ (o:/deals \d+ damage/ or o:/loses \d+ life/) -t:planeswalker -t:land'
      # Magecraft: "whenever you cast or copy"
      - 'o:/whenever you cast or copy (an|a) / (o:/deals \d+ damage/ or o:/loses \d+ life/)'
    exclude:
      - Chromatic Orrery
  tokens:
    queries:
      - 'o:/whenever (~ or another|another|a) creature( you control)? dies/ (o:/loses \d+ life/ or o:/deals \d+ damage/)'
      - 'o:/whenever (~ or another|another|a) creature( you control)? enters/ (o:/loses \d+ life/ or o:/deals \d+ damage/)'
      - 'o:"creatures you control get +" o:"trample until end of turn" (t:sorcery or t:instant or t:creature)'
      - 'o:"gain trample and get +X/+X"'
      # Sacrifice outlets that damage or drain (Goblin Bombardment)
      - 'o:/sacrifice (a|another) creature: / (o:/deals \d+ damage/ or o:/loses \d+ life/)'
    exclude:
      - Chromatic Orrery
  triggers:
    queries:
      - 'o:/whenever (~ or another|another|a) creature( you control)? dies/ (o:/loses \d+ life/ or o:/deals \d+ damage/)'
      - 'o:/whenever (~ or another|another|a) creature( you control)? enters/ (o:/loses \d+ life/ or o:/deals \d+ damage/)'
    exclude:
      - Chromatic Orrery
  lifegain:
    queries:
      - 'o:"whenever you gain life" (o:"deals that much damage" or o:"loses that much life" or o:/loses \d+ life/ or o:/deals \d+ damage/) -t:land'
      - 'o:/pay (\d+|X) life:/ -t:land'
      - 'o:"you win the game" o:/\d+ or more life/ -t:land'
    cards:
      - Bolas's Citadel
    exclude:
      # Life costs that win nothing: a tap ability, a toughness pump, a bounce
      - Myr Convert
      - Wall of Blood
      - Hibernation Sliver
  counters:
    queries:
      - 'o:"remove a +1/+1 counter from" (o:/deals \d+ damage/ or o:"draw a card")'
      - 'o:"+1/+1 counters are put on" o:"draw"'
    exclude:
      - Chromatic Orrery

# The cards that set combos up, per free-form category: Scryfall `queries` (resolved as the
# payoff queries are, the first 25 unblocked cards of each), explicit `cards`, and `exclude`.
# A category may bound its own enabler floor with `min_enablers` and `max_enablers`. Left
# out on purpose: ramp that is no combo piece (signets, talismans, Nature's Lore) and
# tutors, which the slots added by hand to the cube cover. Ramp a query catches anyway
# (Paradise Mantle, Everflowing Chalice) stays: it counts for its category like any card.
enablers:
  fast_mana:
    # One-shot and zero-cost mana rocks: the Lotuses and the Moxen. Black Lotus and the five
    # original Moxen match; block them in `blocklist` if the budget says so.
    queries:
      - 't:artifact mv<=1 o:/sacrifice ~: add/ -t:land -t:creature -o:"draw a card"'
      - 't:artifact mv=0 o:/\{T\}: Add/ -t:land'
    exclude:
      - Sol Talisman  # suspend
      - Mox Tantalite  # suspend
      - Mox Jasper  # needs a dragon
  ritual:
    # Instants and sorceries that add two or more mana at once
    queries:
      - '(t:instant or t:sorcery) mv<=3 o:/^Add (\{[WUBRGC]\}){2,}/'
    exclude:
      - Blazing Firesinger // Seething Song  # a reprint of Seething Song as a double-faced card
  wheel:
    # Every player discards their hand and draws seven, or shuffles it away and draws seven.
    # Named rather than queried: the floor treats every card of a category alike, and a query
    # also finds wheels nobody wants in the slot (Day's Undoing ends the turn, Midnight Clock
    # and Wheel of Fate are slow, Time Reversal costs five), which a build then used to meet
    # the floor instead of these
    cards:
      - Wheel of Fortune
      - Windfall
      - Timetwister
      - Time Spiral
      - Echo of Eons
      - Reforge the Soul
      - Magus of the Wheel
      - Wheel of Misfortune  # "each player secretly chooses a number"
      - Memory Jar  # exiles the hand rather than discarding it
  graveyard:
    # Cheap ways to put a combo piece into the graveyard: Entomb effects and looting. Named
    # for the same reason as the wheels
    cards:
      - Entomb
      - Buried Alive
      - Unmarked Grave
      - Lively Dirge
      - Goblin Engineer
      - Faithless Looting
      - Careful Study
      - Cathartic Reunion
      - Thrill of Possibility
      - Tormenting Voice
