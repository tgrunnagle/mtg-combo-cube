version: '3'

# Defaults shared by the build and precache tasks; override on the command line,
# e.g. task build:ilp CUBE_SIZE=200 MAX_VARIANTS=1000
# Further flags go after "--". The archetype and outcome minimums and the payoff floor are sized for the
# default build, so a smaller one needs: task build:ilp CUBE_SIZE=200 MAX_VARIANTS=1000 -- --min-pair-combos 0 --min-mono-combos 0 --min-outcome-combos 0 --min-payoffs 0
vars:
  CUBE_SIZE: 300
  MAX_VARIANTS: 20000
  MAX_CARDS_IN_COMBO: 4
  TIME_LIMIT: 360
  WORKERS: 8

tasks:
  install:
    desc: Install dependencies
    cmds:
      - uv sync --dev

  lint:
    desc: Run linting with ruff
    cmds:
      - uv run ruff check --select I
      - uv run ruff check .
    deps:
      - install

  lint:fix:
    desc: Run linting with ruff and fix
    cmds:
      - uv run ruff check --select I --fix .
      - uv run ruff check . --fix
    deps:
      - install

  format:
    desc: Fix linting issues and format code
    cmds:
      - uv run ruff format .
    deps:
      - install

  typecheck:
    desc: Run type checking with ty
    cmds:
      - uv run ty check .
    deps:
      - install

  test:
    desc: Run unit tests
    cmds:
      - uv run pytest tests/unit -v
    deps:
      - install

  test:cov:
    desc: Run unit tests with coverage report
    cmds:
      - uv run pytest tests/unit --cov=src --cov-report=term-missing --cov-report=html
    deps:
      - install

  test:watch:
    desc: Run tests in watch mode
    cmds:
      - uv run pytest tests/unit -v --tb=short -x
    deps:
      - install

  check:
    desc: Run all checks (lint, format, typecheck, tests)
    deps:
      - lint
      - format
      - typecheck
      - test

  build:greedy:
    desc: Build a cube using the greedy method
    cmds:
      - uv run python -m src.mtg_combo_cube -c {{.CUBE_SIZE}} --method greedy -o {{.OUTPUT | default "data/cube_greedy.txt"}} -n {{.MAX_VARIANTS}} --read-api-cache
    deps:
      - install

  build:ilp:
    desc: Build a cube using ILP two-phase optimization (default)
    cmds:
      - uv run python -m src.mtg_combo_cube -c {{.CUBE_SIZE}} --method ilp -o {{.OUTPUT | default "data/cube.txt"}} -t {{.TIME_LIMIT}} -n {{.MAX_VARIANTS}} --profile --read-api-cache --workers {{.WORKERS}} {{.CLI_ARGS}}
    deps:
      - install

  build:ilp-single:
    desc: Build a cube using single-phase ILP (max combos only)
    cmds:
      - uv run python -m src.mtg_combo_cube -c {{.CUBE_SIZE}} --method ilp --single-phase -o {{.OUTPUT | default "data/cube_ilp_single.txt"}} -t {{.TIME_LIMIT}} -n {{.MAX_VARIANTS}} --profile --read-api-cache --workers {{.WORKERS}} {{.CLI_ARGS}}
    deps:
      - install

  precache:
    desc: Download the Commander Spellbook and Scryfall data for a build into data/cache
    cmds:
      - uv run python -m src.mtg_combo_cube.precache -n {{.MAX_VARIANTS}} --max-cards-in-combo {{.MAX_CARDS_IN_COMBO}} {{if .BLOCKLIST}}--blocklist "{{.BLOCKLIST}}"{{end}} {{if .PAYOFFS}}--payoffs "{{.PAYOFFS}}"{{end}} {{.CLI_ARGS}}
    deps:
      - install

  help:
    desc: Show available tasks
    cmds:
      - task --list
