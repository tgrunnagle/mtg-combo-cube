version: '3'

tasks:
  install:
    desc: Install dependencies
    cmds:
      - uv sync --dev

  lint:
    desc: Run linting with ruff
    cmds:
      - uv run ruff check --select I
      - uv run ruff check .
    deps:
      - install

  lint:fix:
    desc: Run linting with ruff and fix
    cmds:
      - uv run ruff check --select I --fix .
      - uv run ruff check . --fix
    deps:
      - install

  format:
    desc: Fix linting issues and format code
    cmds:
      - uv run ruff format .
    deps:
      - install

  typecheck:
    desc: Run type checking with ty
    cmds:
      - uv run ty check .
    deps:
      - install

  test:
    desc: Run unit tests
    cmds:
      - uv run pytest tests/unit -v
    deps:
      - install

  test:cov:
    desc: Run unit tests with coverage report
    cmds:
      - uv run pytest tests/unit --cov=src --cov-report=term-missing --cov-report=html
    deps:
      - install

  test:watch:
    desc: Run tests in watch mode
    cmds:
      - uv run pytest tests/unit -v --tb=short -x
    deps:
      - install

  check:
    desc: Run all checks (lint, format, typecheck, tests)
    deps:
      - lint
      - format
      - typecheck
      - test

  build:greedy:
    desc: Build a cube using the greedy method
    cmds:
      - uv run python -m src.mtg_combo_cube -c {{.CUBE_SIZE | default "300"}} --method greedy -o {{.OUTPUT | default "data/cube_greedy.txt"}} -n {{.MAX_VARIANTS | default "10000"}} --read-api-cache
    deps:
      - install

  build:ilp:
    desc: Build a cube using ILP two-phase optimization (default)
    cmds:
      - uv run python -m src.mtg_combo_cube -c {{.CUBE_SIZE | default "300"}} --method ilp -o {{.OUTPUT | default "data/cube.txt"}} -t {{.TIME_LIMIT | default "1800"}} -n {{.MAX_VARIANTS | default "10000"}} --profile --read-api-cache
    deps:
      - install

  build:ilp-single:
    desc: Build a cube using single-phase ILP (max combos only)
    cmds:
      - uv run python -m src.mtg_combo_cube -c {{.CUBE_SIZE | default "300"}} --method ilp --single-phase -o {{.OUTPUT | default "data/cube_ilp_single.txt"}} -t {{.TIME_LIMIT | default "300"}} -n {{.MAX_VARIANTS | default "10000"}} --profile --read-api-cache
    deps:
      - install

  help:
    desc: Show available tasks
    cmds:
      - task --list
